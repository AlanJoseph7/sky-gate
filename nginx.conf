# ══════════════════════════════════════════════════════════════════════════════
# nginx.conf — SkyGate Reverse Proxy with TLS Termination
#
# WHAT THIS DOES
# ──────────────
# • Terminates TLS at nginx so the Python server never sees plaintext JWT tokens
#   or credentials travelling over the network.
# • Redirects all HTTP → HTTPS (port 80 → 443).
# • Proxies everything to the local uvicorn process on 127.0.0.1:5000.
# • Enables SSE (EventSource) streaming with correct buffering settings.
# • Sets security headers: HSTS, CSP, X-Frame-Options, X-Content-Type-Options.
#
# QUICK START (Linux/macOS with Let's Encrypt)
# ─────────────────────────────────────────────
# 1. Install certbot:
#      sudo apt install certbot python3-certbot-nginx   # Debian/Ubuntu
#      brew install certbot                             # macOS
#
# 2. Obtain a certificate (replace YOUR_DOMAIN):
#      sudo certbot --nginx -d YOUR_DOMAIN
#
# 3. Copy this file to /etc/nginx/sites-available/skygate:
#      sudo cp nginx.conf /etc/nginx/sites-available/skygate
#      sudo ln -s /etc/nginx/sites-available/skygate /etc/nginx/sites-enabled/
#
# 4. Edit the server_name and ssl_certificate paths below.
#
# 5. Test and reload:
#      sudo nginx -t && sudo systemctl reload nginx
#
# SELF-SIGNED CERTIFICATE (local dev/testing)
# ─────────────────────────────────────────────
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout skygate-selfsigned.key \
#     -out    skygate-selfsigned.crt \
#     -subj "/CN=localhost"
#   # Then update ssl_certificate / ssl_certificate_key paths below.
#
# WINDOWS (using Caddy instead of nginx — easier)
# ──────────────────────────────────────────────────
#   Install Caddy: https://caddyserver.com/docs/install
#   Create a Caddyfile:
#     YOUR_DOMAIN {
#       reverse_proxy localhost:5000
#     }
#   Run: caddy run --config Caddyfile
# ══════════════════════════════════════════════════════════════════════════════

# ── Rate limiting zone (shared memory, 10 MB, 30 req/s per IP) ──────────────
limit_req_zone $binary_remote_addr zone=skygate_api:10m rate=30r/s;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    # ← Replace with your actual domain or IP
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Immediately redirect to HTTPS — no content served over HTTP
    return 301 https://$host$request_uri;
}

# ── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ── TLS certificates (update paths after certbot / openssl) ──────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling — reduces TLS handshake time
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                         always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "geolocation=(self), camera=(), microphone=()" always;
    # Content-Security-Policy: tighten as needed for your CDN assets
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:;"
        always;

    # ── Rate limiting on API endpoints ────────────────────────────────────────
    location /api/ {
        limit_req zone=skygate_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE stream endpoint — MUST disable buffering ─────────────────────────
    # Without these, nginx buffers the EventSource stream and the browser
    # never receives events until the buffer flushes (very bad UX).
    location /api/stream {
        proxy_pass             http://127.0.0.1:5000;
        proxy_http_version     1.1;
        proxy_set_header       Connection "";   # keep-alive for SSE
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_buffering        off;             # disable response buffer
        proxy_cache            off;
        proxy_read_timeout     86400s;          # 24 h — SSE connections are long-lived
        proxy_send_timeout     86400s;
        chunked_transfer_encoding on;
        add_header             X-Accel-Buffering no;  # for nginx behind nginx
    }

    # ── Static frontend and everything else ──────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache static assets aggressively (browser caches CSS/JS for 1 year)
        location ~* \.(css|js|woff2?|svg|ico|png|jpg|webp)$ {
            proxy_pass       http://127.0.0.1:5000;
            proxy_set_header Host $host;
            expires          1y;
            add_header       Cache-Control "public, immutable";
        }
    }

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/skygate_access.log combined;
    error_log  /var/log/nginx/skygate_error.log  warn;
}
